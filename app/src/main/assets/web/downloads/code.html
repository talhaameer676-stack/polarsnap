<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"/>
  <meta name="theme-color" content="#F1F5F9"/>
  <title>PolarSnap — Library</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      overscroll-behavior: none;
      -webkit-tap-highlight-color: transparent;
    }
    .pb-safe { padding-bottom: env(safe-area-inset-bottom, 16px); }
    .pt-safe { padding-top: env(safe-area-inset-top, 16px); }
    ::-webkit-scrollbar { display: none; }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 antialiased min-h-screen flex flex-col justify-between select-none">

  <!-- Top App Bar -->
  <header class="w-full bg-slate-100/90 backdrop-blur-md pt-safe px-5 py-3 sticky top-0 z-30">
    <div class="flex items-center justify-between h-12">
      <!-- App Identity -->
      <div class="flex items-center gap-3">
        <img src="../images/logo.png" onerror="this.style.display='none'" class="w-9 h-9 rounded-full object-cover shadow-sm bg-white" alt=""/>
        <h1 class="text-xl font-bold tracking-tight text-slate-900">
          Library
        </h1>
      </div>

      <!-- Settings / Refresh Icon -->
      <div class="flex items-center gap-1">
        <button id="btn-refresh" type="button" class="w-10 h-10 rounded-full flex items-center justify-center text-slate-600 hover:bg-slate-200 active:scale-95 transition-all">
          <span class="material-symbols-outlined text-[22px]">refresh</span>
        </button>
      </div>
    </div>
  </header>

  <!-- Main Tasks List -->
  <main class="flex-1 px-4 py-2 flex flex-col gap-4 max-w-lg mx-auto w-full pb-24">

    <!-- Segmented Capsule (Active vs Completed) -->
    <div class="w-full bg-slate-200/80 p-1 rounded-2xl flex items-center justify-between text-xs font-semibold">
      <button id="tab-active" class="flex-1 py-2 px-3 rounded-xl bg-white text-sky-800 shadow-sm flex items-center justify-center gap-1.5 transition-all">
        <span class="material-symbols-outlined text-[16px]">downloading</span>
        <span>Downloading</span>
        <span id="badge-active" class="px-1.5 py-0.2 bg-sky-100 text-sky-800 rounded-full text-[10px]">0</span>
      </button>

      <button id="tab-completed" class="flex-1 py-2 px-3 rounded-xl text-slate-500 hover:text-slate-800 flex items-center justify-center gap-1.5 transition-all">
        <span class="material-symbols-outlined text-[16px]">check_circle</span>
        <span>Completed</span>
        <span id="badge-completed" class="px-1.5 py-0.2 bg-slate-300 text-slate-700 rounded-full text-[10px]">0</span>
      </button>
    </div>

    <!-- Active Tasks Container -->
    <div id="tasks-container" class="flex flex-col gap-3">
      <!-- Populated dynamically -->
      <div id="empty-state" class="bg-white rounded-3xl p-8 border border-slate-200 text-center flex flex-col items-center justify-center gap-2 mt-4 shadow-sm">
        <span class="material-symbols-outlined text-slate-300 text-[40px]">downloading</span>
        <span class="text-sm font-semibold text-slate-600">No downloads right now</span>
        <p class="text-xs text-slate-400 max-w-[220px]">
          Copy any video link and tap Download on the Capture tab to start.
        </p>
        <button id="btn-go-capture" type="button" class="mt-2 px-4 py-2 bg-sky-700 hover:bg-sky-800 active:scale-95 text-white text-xs font-semibold rounded-full shadow-sm transition-all">
          Go to Capture
        </button>
      </div>
    </div>

  </main>

  <!-- Bottom Navigation Bar -->
  <nav class="fixed bottom-0 w-full z-40 bg-white/95 backdrop-blur-lg border-t border-slate-200 pb-safe">
    <div class="h-16 px-6 flex items-center justify-around">
      <button data-screen="home" class="nav-tab flex flex-col items-center justify-center gap-1 text-slate-400 hover:text-slate-600 transition-colors">
        <span class="material-symbols-outlined text-[22px]">bolt</span>
        <span class="text-[11px]">Capture</span>
      </button>

      <button data-screen="downloads" class="nav-tab flex flex-col items-center justify-center gap-1 text-sky-700 font-semibold transition-colors">
        <span class="material-symbols-outlined text-[22px]">folder_zip</span>
        <span class="text-[11px]">Library</span>
      </button>

      <button data-screen="settings" class="nav-tab flex flex-col items-center justify-center gap-1 text-slate-400 hover:text-slate-600 transition-colors">
        <span class="material-symbols-outlined text-[22px]">tune</span>
        <span class="text-[11px]">Engine</span>
      </button>
    </div>
  </nav>

  <script>
    (function () {
      const tasksContainer = document.getElementById('tasks-container');
      const emptyState = document.getElementById('empty-state');
      const btnRefresh = document.getElementById('btn-refresh');
      const btnGoCapture = document.getElementById('btn-go-capture');
      const badgeActive = document.getElementById('badge-active');
      const badgeCompleted = document.getElementById('badge-completed');

      // Navigation
      document.querySelectorAll('.nav-tab').forEach(tab => {
        tab.addEventListener('click', () => {
          const screen = tab.getAttribute('data-screen');
          if (window.PolarSnap && window.PolarSnap.navigate) {
            window.PolarSnap.navigate(screen);
          }
        });
      });

      if (btnGoCapture) {
        btnGoCapture.addEventListener('click', () => {
          if (window.PolarSnap && window.PolarSnap.navigate) {
            window.PolarSnap.navigate('home');
          }
        });
      }

      function renderTasks() {
        if (!window.PolarSnap || !window.PolarSnap.getTasksJson) {
          return;
        }

        try {
          const jsonStr = window.PolarSnap.getTasksJson();
          const tasks = JSON.parse(jsonStr || "[]");

          const active = tasks.filter(t => t.state === "DOWNLOADING" || t.state === "REMASTERING" || t.state === "QUEUED");
          const completed = tasks.filter(t => t.state === "COMPLETED");

          badgeActive.textContent = active.length;
          badgeCompleted.textContent = completed.length;

          if (tasks.length === 0) {
            tasksContainer.innerHTML = '';
            tasksContainer.appendChild(emptyState);
            return;
          }

          tasksContainer.innerHTML = '';

          tasks.forEach(task => {
            const card = document.createElement('div');
            card.className = "bg-white rounded-2xl p-4 border border-slate-200 shadow-sm flex flex-col gap-3";

            const isDone = task.state === "COMPLETED";
            const percent = Math.min(100, Math.max(0, task.progress || 0));

            card.innerHTML = `
              <div class="flex items-start justify-between gap-3">
                <div class="flex items-center gap-3 min-w-0">
                  <div class="w-10 h-10 rounded-xl bg-sky-50 text-sky-700 flex items-center justify-center shrink-0">
                    <span class="material-symbols-outlined text-[20px]">${isDone ? 'check_circle' : 'movie'}</span>
                  </div>
                  <div class="flex flex-col min-w-0">
                    <h3 class="text-xs font-bold text-slate-800 truncate">${task.title || 'Video Media'}</h3>
                    <span class="text-[10px] text-slate-400 font-medium">${task.state}</span>
                  </div>
                </div>
                ${!isDone ? `
                  <button data-task-cancel="${task.id}" class="w-7 h-7 rounded-full text-slate-400 hover:text-red-500 flex items-center justify-center">
                    <span class="material-symbols-outlined text-[16px]">close</span>
                  </button>
                ` : ''}
              </div>

              ${!isDone ? `
                <div class="w-full bg-slate-100 rounded-full h-1.5 overflow-hidden">
                  <div class="bg-sky-600 h-full rounded-full transition-all duration-300" style="width: ${percent}%;"></div>
                </div>
                <div class="flex items-center justify-between text-[10px] text-slate-400">
                  <span>${percent}%</span>
                  <span>${task.speed ? (task.speed / 1024 / 1024).toFixed(1) + ' MB/s' : ''}</span>
                </div>
              ` : `
                <div class="text-[10px] text-emerald-600 font-semibold flex items-center gap-1">
                  <span class="material-symbols-outlined text-[14px]">verified</span>
                  <span>Saved to Gallery & Downloads</span>
                </div>
              `}
            `;

            const cancelBtn = card.querySelector(`[data-task-cancel="${task.id}"]`);
            if (cancelBtn) {
              cancelBtn.addEventListener('click', () => {
                if (window.PolarSnap && window.PolarSnap.cancelTask) {
                  window.PolarSnap.cancelTask(task.id);
                  renderTasks();
                }
              });
            }

            tasksContainer.appendChild(card);
          });

        } catch (e) {
          console.error("renderTasks error:", e);
        }
      }

      // Initial render & poll every 2s
      renderTasks();
      setInterval(renderTasks, 2000);

      if (btnRefresh) {
        btnRefresh.addEventListener('click', renderTasks);
      }
    })();
  </script>
</body>
</html>
