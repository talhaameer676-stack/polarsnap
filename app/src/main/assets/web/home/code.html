<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"/>
  <meta name="theme-color" content="#F1F5F9"/>
  <title>PolarSnap</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      overscroll-behavior: none;
      -webkit-tap-highlight-color: transparent;
    }
    .pb-safe { padding-bottom: env(safe-area-inset-bottom, 16px); }
    .pt-safe { padding-top: env(safe-area-inset-top, 16px); }
    ::-webkit-scrollbar { display: none; }
    
    /* Smooth Bottom Sheet transitions */
    #bottom-sheet {
      transition: transform 0.28s cubic-bezier(0.32, 0.72, 0, 1), opacity 0.2s ease;
    }
    #backdrop {
      transition: opacity 0.25s ease;
    }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 antialiased min-h-screen flex flex-col justify-between select-none">

  <!-- Top App Bar (SealX inspired: Clean, minimal, zero bloat) -->
  <header class="w-full bg-slate-100/90 backdrop-blur-md pt-safe px-5 py-3 sticky top-0 z-30">
    <div class="flex items-center justify-between h-12">
      <!-- App Identity -->
      <div class="flex items-center gap-3">
        <img src="../images/logo.png" onerror="this.style.display='none'" class="w-9 h-9 rounded-full object-cover shadow-sm bg-white" alt=""/>
        <div class="flex flex-col">
          <h1 class="text-xl font-bold tracking-tight text-slate-900 flex items-center gap-1.5">
            PolarSnap
          </h1>
        </div>
      </div>

      <!-- Action Icons (Dark mode & Settings only, NO profile avatar) -->
      <div class="flex items-center gap-1">
        <button id="theme-toggle" type="button" class="w-10 h-10 rounded-full flex items-center justify-center text-slate-600 hover:bg-slate-200 active:scale-95 transition-all">
          <span class="material-symbols-outlined text-[22px]">dark_mode</span>
        </button>
        <button id="nav-settings-btn" type="button" class="w-10 h-10 rounded-full flex items-center justify-center text-slate-600 hover:bg-slate-200 active:scale-95 transition-all">
          <span class="material-symbols-outlined text-[22px]">more_vert</span>
        </button>
      </div>
    </div>
  </header>

  <!-- Main Content Area -->
  <main class="flex-1 px-4 py-2 flex flex-col gap-5 max-w-lg mx-auto w-full pb-24">

    <!-- Subtle Floating Clipboard Discovery Banner (Shows ONLY for new unhandled links) -->
    <div id="clipboard-banner" class="hidden bg-sky-50 border border-sky-200 rounded-2xl p-3 shadow-sm flex items-center justify-between gap-3 animate-fade-in">
      <div class="flex items-center gap-2.5 min-w-0">
        <div class="w-8 h-8 rounded-full bg-sky-600 text-white flex items-center justify-center shrink-0">
          <span class="material-symbols-outlined text-[18px]">content_paste</span>
        </div>
        <div class="flex flex-col min-w-0">
          <span class="text-xs font-semibold text-sky-900 truncate" id="clip-banner-title">Link detected in clipboard</span>
          <span class="text-[11px] text-sky-700 truncate" id="clip-banner-url">https://...</span>
        </div>
      </div>
      <div class="flex items-center gap-1 shrink-0">
        <button id="clip-banner-open" type="button" class="px-3 py-1.5 bg-sky-600 active:bg-sky-700 text-white text-xs font-medium rounded-full shadow-sm">
          Open
        </button>
        <button id="clip-banner-dismiss" type="button" class="p-1 text-sky-400 hover:text-sky-700 rounded-full">
          <span class="material-symbols-outlined text-[16px]">close</span>
        </button>
      </div>
    </div>

    <!-- Main Seal-Inspired Paste & Download Card -->
    <section class="flex flex-col gap-2">
      <p class="text-xs font-medium text-slate-500 px-1">
        Paste a link and pick the quality you want.
      </p>

      <div class="bg-white rounded-3xl p-4 shadow-sm border border-slate-200 flex flex-col gap-3">
        <!-- URL Input Box with Clear Button -->
        <div class="relative flex items-center bg-slate-50 border border-slate-300 rounded-2xl px-3 py-2.5 focus-within:border-sky-500 focus-within:ring-2 focus-within:ring-sky-100 transition-all">
          <span class="material-symbols-outlined text-slate-400 text-[20px] mr-2 shrink-0">link</span>
          <input 
            type="url" 
            id="url-input" 
            placeholder="Paste video URL here..." 
            value="" 
            class="w-full bg-transparent text-sm text-slate-800 placeholder-slate-400 focus:outline-none"
            autocomplete="off"
            autocorrect="off"
            autocapitalize="off"
            spellcheck="false"
          />
          <button id="clear-btn" type="button" class="hidden w-7 h-7 rounded-full text-slate-400 hover:text-slate-600 flex items-center justify-center transition-colors shrink-0">
            <span class="material-symbols-outlined text-[18px]">cancel</span>
          </button>
        </div>

        <!-- Wide Button: Paste link from clipboard -->
        <button id="btn-paste-clipboard" type="button" class="w-full h-11 bg-slate-100 hover:bg-slate-200 active:scale-[0.99] text-slate-700 font-medium text-xs rounded-2xl flex items-center justify-center gap-2 border border-slate-200/60 transition-all">
          <span class="material-symbols-outlined text-[18px] text-slate-500">content_paste</span>
          <span>Paste link from clipboard</span>
        </button>

        <!-- Action Buttons Row (Paste & Download) -->
        <div class="grid grid-cols-2 gap-2.5 pt-1">
          <button id="btn-action-paste" type="button" class="h-12 bg-slate-100 hover:bg-slate-200 active:scale-95 text-slate-700 font-semibold text-xs rounded-2xl flex items-center justify-center gap-2 transition-all">
            <span class="material-symbols-outlined text-[18px]">content_paste</span>
            <span>Paste</span>
          </button>

          <button id="btn-action-download" type="button" class="h-12 bg-sky-700 hover:bg-sky-800 active:scale-95 text-white font-semibold text-xs rounded-2xl flex items-center justify-center gap-2 shadow-sm shadow-sky-700/20 transition-all">
            <span class="material-symbols-outlined text-[20px]">cloud_download</span>
            <span>Download</span>
          </button>
        </div>
      </div>
    </section>

    <!-- Quick Enhancements Toggles (4K Remaster & Clean Watermark) -->
    <section class="flex flex-col gap-2">
      <span class="text-xs font-semibold text-slate-400 uppercase tracking-wider px-1">Enhancements</span>
      <div class="grid grid-cols-2 gap-2">
        <!-- 4K Remaster Toggle Card -->
        <label class="flex items-center justify-between p-3 bg-white rounded-2xl border border-slate-200/80 shadow-sm cursor-pointer active:scale-98 transition-all">
          <div class="flex items-center gap-2 min-w-0">
            <span class="material-symbols-outlined text-sky-600 text-[20px]">auto_awesome</span>
            <div class="flex flex-col min-w-0">
              <span class="text-xs font-semibold text-slate-800">4K Remaster</span>
              <span class="text-[10px] text-slate-400">Lanczos 60fps</span>
            </div>
          </div>
          <input type="checkbox" id="toggle-remaster" checked class="w-4 h-4 text-sky-600 rounded focus:ring-sky-500">
        </label>

        <!-- Clean Watermark Toggle Card -->
        <label class="flex items-center justify-between p-3 bg-white rounded-2xl border border-slate-200/80 shadow-sm cursor-pointer active:scale-98 transition-all">
          <div class="flex items-center gap-2 min-w-0">
            <span class="material-symbols-outlined text-teal-600 text-[20px]">cleaning_services</span>
            <div class="flex flex-col min-w-0">
              <span class="text-xs font-semibold text-slate-800">No Watermark</span>
              <span class="text-[10px] text-slate-400">Reels / TikTok</span>
            </div>
          </div>
          <input type="checkbox" id="toggle-watermark" checked class="w-4 h-4 text-teal-600 rounded focus:ring-teal-500">
        </label>
      </div>
    </section>

    <!-- Recent Downloads Section -->
    <section class="flex flex-col gap-2.5">
      <div class="flex items-center justify-between px-1">
        <h2 class="text-sm font-semibold text-slate-700">Recent downloads</h2>
        <button id="btn-see-all" type="button" class="text-xs font-semibold text-sky-600 hover:text-sky-700 active:underline">
          See all
        </button>
      </div>

      <!-- Recent list container -->
      <div id="recent-container" class="flex flex-col gap-2">
        <div class="bg-white/80 rounded-2xl p-6 border border-dashed border-slate-300 text-center flex flex-col items-center justify-center gap-2">
          <span class="material-symbols-outlined text-slate-300 text-[32px]">download_done</span>
          <span class="text-xs text-slate-400">No recent downloads yet</span>
          <span class="text-[11px] text-slate-400">Paste any video link above to begin</span>
        </div>
      </div>
    </section>

  </main>

  <!-- Bottom Navigation Bar (Seal-style clean tabs) -->
  <nav class="fixed bottom-0 w-full z-40 bg-white/95 backdrop-blur-lg border-t border-slate-200 pb-safe">
    <div class="h-16 px-6 flex items-center justify-around">
      <button data-screen="home" class="nav-tab flex flex-col items-center justify-center gap-1 text-sky-700 font-semibold transition-colors">
        <span class="material-symbols-outlined text-[22px]">bolt</span>
        <span class="text-[11px]">Capture</span>
      </button>

      <button data-screen="downloads" class="nav-tab flex flex-col items-center justify-center gap-1 text-slate-400 hover:text-slate-600 transition-colors">
        <span class="material-symbols-outlined text-[22px]">folder_zip</span>
        <span class="text-[11px]">Library</span>
      </button>

      <button data-screen="settings" class="nav-tab flex flex-col items-center justify-center gap-1 text-slate-400 hover:text-slate-600 transition-colors">
        <span class="material-symbols-outlined text-[22px]">tune</span>
        <span class="text-[11px]">Engine</span>
      </button>
    </div>
  </nav>

  <!-- ======================================================== -->
  <!-- Quality Selection Bottom Sheet Modal (SealX Inspired)     -->
  <!-- ======================================================== -->
  <div id="backdrop" class="fixed inset-0 bg-slate-900/60 z-50 opacity-0 pointer-events-none transition-opacity"></div>

  <div id="bottom-sheet" class="fixed bottom-0 left-0 right-0 z-50 bg-white rounded-t-[32px] p-5 shadow-2xl transform translate-y-full opacity-0 pointer-events-none pb-safe max-w-lg mx-auto">
    <!-- Drag Handle Bar -->
    <div class="w-10 h-1.5 bg-slate-300 rounded-full mx-auto mb-4 cursor-pointer" id="sheet-handle"></div>

    <!-- Video Metadata Header -->
    <div class="flex items-start justify-between gap-3 pb-4 border-b border-slate-100">
      <div class="flex items-center gap-3 min-w-0">
        <!-- Thumbnail / Platform Badge -->
        <div id="sheet-thumb-box" class="w-14 h-14 rounded-2xl bg-gradient-to-br from-sky-500 to-indigo-600 text-white flex items-center justify-center shrink-0 shadow-sm overflow-hidden">
          <span id="sheet-platform-icon" class="material-symbols-outlined text-[28px]">movie</span>
        </div>
        <!-- Title & Platform text -->
        <div class="flex flex-col min-w-0">
          <h3 id="sheet-video-title" class="text-sm font-bold text-slate-900 truncate">
            Video Media Stream
          </h3>
          <div class="flex items-center gap-1.5 text-xs text-slate-500 mt-0.5">
            <span class="material-symbols-outlined text-[14px] text-sky-600">public</span>
            <span id="sheet-platform-name">Online Platform</span>
          </div>
        </div>
      </div>

      <!-- Close Sheet Button -->
      <button id="btn-close-sheet" type="button" class="w-8 h-8 rounded-full bg-slate-100 hover:bg-slate-200 text-slate-500 flex items-center justify-center shrink-0 active:scale-95 transition-all">
        <span class="material-symbols-outlined text-[20px]">close</span>
      </button>
    </div>

    <!-- Choose Quality Section -->
    <div class="py-4 flex flex-col gap-2.5">
      <span class="text-xs font-semibold text-slate-500">Choose quality</span>

      <div class="grid grid-cols-3 gap-2" id="quality-options">
        <!-- 1080p (Active by default) -->
        <button type="button" data-quality="1080p" class="quality-btn active h-12 rounded-2xl bg-sky-100 border-2 border-sky-600 text-sky-900 font-semibold text-xs flex items-center justify-center gap-1.5 transition-all shadow-sm">
          <span class="material-symbols-outlined text-[16px] text-sky-700">check_circle</span>
          <span>1080p</span>
        </button>

        <!-- 720p -->
        <button type="button" data-quality="720p" class="quality-btn h-12 rounded-2xl bg-slate-50 border border-slate-200 text-slate-700 font-semibold text-xs flex items-center justify-center gap-1.5 transition-all">
          <span>720p</span>
        </button>

        <!-- Audio MP3 -->
        <button type="button" data-quality="audio" class="quality-btn h-12 rounded-2xl bg-slate-50 border border-slate-200 text-slate-700 font-semibold text-xs flex items-center justify-center gap-1.5 transition-all">
          <span class="material-symbols-outlined text-[16px] text-slate-400">music_note</span>
          <span>Audio</span>
        </button>
      </div>
    </div>

    <!-- Final Download Action Button in Sheet -->
    <div class="pt-2">
      <button id="sheet-btn-download" type="button" class="w-full h-13 py-3.5 bg-sky-700 hover:bg-sky-800 active:scale-[0.98] text-white font-bold text-sm rounded-2xl flex items-center justify-center gap-2 shadow-lg shadow-sky-700/25 transition-all">
        <span class="material-symbols-outlined text-[22px]">cloud_download</span>
        <span>Download</span>
      </button>
    </div>
  </div>

  <!-- JavaScript Client Controller -->
  <script>
    (function () {
      const urlInput = document.getElementById('url-input');
      const clearBtn = document.getElementById('clear-btn');
      const btnPasteClipboard = document.getElementById('btn-paste-clipboard');
      const btnActionPaste = document.getElementById('btn-action-paste');
      const btnActionDownload = document.getElementById('btn-action-download');
      const btnSeeAll = document.getElementById('btn-see-all');
      const navSettingsBtn = document.getElementById('nav-settings-btn');

      // Clipboard banner elements
      const clipBanner = document.getElementById('clipboard-banner');
      const clipBannerTitle = document.getElementById('clip-banner-title');
      const clipBannerUrl = document.getElementById('clip-banner-url');
      const clipBannerOpen = document.getElementById('clip-banner-open');
      const clipBannerDismiss = document.getElementById('clip-banner-dismiss');

      // Bottom Sheet Elements
      const backdrop = document.getElementById('backdrop');
      const bottomSheet = document.getElementById('bottom-sheet');
      const sheetHandle = document.getElementById('sheet-handle');
      const btnCloseSheet = document.getElementById('btn-close-sheet');
      const sheetVideoTitle = document.getElementById('sheet-video-title');
      const sheetPlatformName = document.getElementById('sheet-platform-name');
      const sheetPlatformIcon = document.getElementById('sheet-platform-icon');
      const sheetBtnDownload = document.getElementById('sheet-btn-download');
      const qualityBtns = document.querySelectorAll('.quality-btn');

      // State
      let selectedQuality = "1080p";
      let lastClearedUrl = "";
      let activeUrl = "";

      // Input change: show/hide clear button
      function updateInputState() {
        const val = urlInput.value.trim();
        if (val) {
          clearBtn.classList.remove('hidden');
        } else {
          clearBtn.classList.add('hidden');
        }
      }

      urlInput.addEventListener('input', updateInputState);

      // Clear button: clears and marks URL as dismissed so auto-detect NEVER re-pastes it!
      clearBtn.addEventListener('click', () => {
        lastClearedUrl = urlInput.value.trim();
        urlInput.value = '';
        updateInputState();
        clipBanner.classList.add('hidden');
        urlInput.focus();
      });

      // Navigation tabs
      document.querySelectorAll('.nav-tab').forEach(tab => {
        tab.addEventListener('click', () => {
          const screen = tab.getAttribute('data-screen');
          if (window.PolarSnap && window.PolarSnap.navigate) {
            window.PolarSnap.navigate(screen);
          } else {
            console.log("Nav to " + screen);
          }
        });
      });

      if (btnSeeAll) {
        btnSeeAll.addEventListener('click', () => {
          if (window.PolarSnap && window.PolarSnap.navigate) {
            window.PolarSnap.navigate('downloads');
          }
        });
      }

      if (navSettingsBtn) {
        navSettingsBtn.addEventListener('click', () => {
          if (window.PolarSnap && window.PolarSnap.navigate) {
            window.PolarSnap.navigate('settings');
          }
        });
      }

      // Detect platform & title from URL
      function parseUrlInfo(url) {
        const lower = url.toLowerCase();
        let platform = "Web Video";
        let icon = "smart_display";
        let title = "Online Media";

        if (lower.includes("instagram.com")) {
          platform = "Instagram";
          icon = "photo_camera";
          if (lower.includes("/reel/")) {
            const part = url.split("/reel/")[1].split("/")[0].split("?")[0];
            title = "Instagram Reel (" + part.substring(0, 10) + ")";
          } else {
            title = "Instagram Post";
          }
        } else if (lower.includes("youtube.com") || lower.includes("youtu.be")) {
          platform = "YouTube";
          icon = "smart_display";
          title = "YouTube Video";
        } else if (lower.includes("tiktok.com")) {
          platform = "TikTok";
          icon = "music_note";
          title = "TikTok Video";
        } else if (lower.includes("x.com") || lower.includes("twitter.com")) {
          platform = "X / Twitter";
          icon = "tag";
          title = "Twitter Video";
        } else if (lower.includes("facebook.com") || lower.includes("fb.watch")) {
          platform = "Facebook";
          icon = "public";
          title = "Facebook Video";
        }

        return { platform, icon, title };
      }

      // Open Bottom Sheet Modal
      function openBottomSheet(url) {
        if (!url) return;
        activeUrl = url;
        const info = parseUrlInfo(url);

        sheetVideoTitle.textContent = info.title;
        sheetPlatformName.textContent = info.platform;
        sheetPlatformIcon.textContent = info.icon;

        backdrop.classList.remove('opacity-0', 'pointer-events-none');
        backdrop.classList.add('opacity-100');

        bottomSheet.classList.remove('translate-y-full', 'opacity-0', 'pointer-events-none');
        bottomSheet.classList.add('translate-y-0', 'opacity-100');
      }

      // Close Bottom Sheet Modal
      function closeBottomSheet() {
        backdrop.classList.remove('opacity-100');
        backdrop.classList.add('opacity-0', 'pointer-events-none');

        bottomSheet.classList.remove('translate-y-0', 'opacity-100');
        bottomSheet.classList.add('translate-y-full', 'opacity-0', 'pointer-events-none');
      }

      backdrop.addEventListener('click', closeBottomSheet);
      btnCloseSheet.addEventListener('click', closeBottomSheet);
      sheetHandle.addEventListener('click', closeBottomSheet);

      // Quality Selection in Sheet
      qualityBtns.forEach(btn => {
        btn.addEventListener('click', () => {
          qualityBtns.forEach(b => {
            b.classList.remove('active', 'bg-sky-100', 'border-2', 'border-sky-600', 'text-sky-900', 'shadow-sm');
            b.classList.add('bg-slate-50', 'border', 'border-slate-200', 'text-slate-700');
            const check = b.querySelector('.material-symbols-outlined');
            if (check && check.textContent === 'check_circle') {
              check.remove();
            }
          });

          btn.classList.add('active', 'bg-sky-100', 'border-2', 'border-sky-600', 'text-sky-900', 'shadow-sm');
          btn.classList.remove('bg-slate-50', 'border', 'border-slate-200', 'text-slate-700');

          selectedQuality = btn.getAttribute('data-quality');
          if (!btn.querySelector('.material-symbols-outlined') && selectedQuality !== 'audio') {
            const icon = document.createElement('span');
            icon.className = 'material-symbols-outlined text-[16px] text-sky-700';
            icon.textContent = 'check_circle';
            btn.prepend(icon);
          }
        });
      });

      // Sheet Download Action
      sheetBtnDownload.addEventListener('click', () => {
        const url = activeUrl || urlInput.value.trim();
        if (!url) return;

        const isRemaster = document.getElementById('toggle-remaster').checked;
        const format = selectedQuality === 'audio' ? 'MP3' : (selectedQuality === '720p' ? '720p' : 'MP4');

        closeBottomSheet();

        if (window.PolarSnap && window.PolarSnap.startDownload) {
          window.PolarSnap.startDownload(url, format, isRemaster, "NONE");
        } else {
          alert("Starting download: " + url + " [" + format + "]");
        }
      });

      // Get clipboard text helper
      function getClipText() {
        if (window.PolarSnap && window.PolarSnap.getClipboardText) {
          return window.PolarSnap.getClipboardText() || "";
        }
        return "";
      }

      // Paste CTA logic: Fetches clipboard, fills input, and slides up bottom sheet!
      function handlePasteAndPrompt() {
        const text = getClipText();
        if (text && (text.startsWith("http://") || text.startsWith("https://"))) {
          urlInput.value = text;
          updateInputState();
          openBottomSheet(text);
        } else {
          if (urlInput.value.trim()) {
            openBottomSheet(urlInput.value.trim());
          } else if (window.PolarSnap && window.PolarSnap.showToast) {
            window.PolarSnap.showToast("No valid link found in clipboard");
          } else {
            alert("Please copy a video link first");
          }
        }
      }

      btnPasteClipboard.addEventListener('click', handlePasteAndPrompt);
      btnActionPaste.addEventListener('click', handlePasteAndPrompt);

      // Download button on card
      btnActionDownload.addEventListener('click', () => {
        const val = urlInput.value.trim();
        if (val) {
          openBottomSheet(val);
        } else {
          handlePasteAndPrompt();
        }
      });

      // Check clipboard on launch / resume for NEW link
      function checkClipboardAutoDetect() {
        try {
          const text = getClipText();
          if (!text) return;
          const trimmed = text.trim();

          // Only proceed if it is a valid web link
          if (!trimmed.startsWith("http://") && !trimmed.startsWith("https://")) {
            return;
          }

          // If the user already cleared this exact URL, DO NOT annoy them again!
          if (trimmed === lastClearedUrl) {
            return;
          }

          // If input is empty, show non-intrusive banner
          if (!urlInput.value.trim()) {
            const info = parseUrlInfo(trimmed);
            clipBannerTitle.textContent = info.platform + " link detected";
            clipBannerUrl.textContent = trimmed;
            clipBanner.classList.remove('hidden');

            clipBannerOpen.onclick = () => {
              urlInput.value = trimmed;
              updateInputState();
              clipBanner.classList.add('hidden');
              openBottomSheet(trimmed);
            };

            clipBannerDismiss.onclick = () => {
              lastClearedUrl = trimmed;
              clipBanner.classList.add('hidden');
            };
          }
        } catch (_) {}
      }

      // Check on load
      checkClipboardAutoDetect();

      // Theme toggle (light / dark)
      const themeToggle = document.getElementById('theme-toggle');
      let isDark = false;
      themeToggle.addEventListener('click', () => {
        isDark = !isDark;
        if (isDark) {
          document.body.classList.remove('bg-slate-100', 'text-slate-800');
          document.body.classList.add('bg-slate-900', 'text-slate-100');
          themeToggle.querySelector('span').textContent = 'light_mode';
        } else {
          document.body.classList.add('bg-slate-100', 'text-slate-800');
          document.body.classList.remove('bg-slate-900', 'text-slate-100');
          themeToggle.querySelector('span').textContent = 'dark_mode';
        }
      });

    })();
  </script>
</body>
</html>
